name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven tests
        working-directory: backend
        run: mvn test

  integration:
    name: Testcontainers integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run integration matrix
        working-directory: backend
        run: mvn verify -Pfailsafe

      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports
          path: backend/target/failsafe-reports/
          if-no-files-found: ignore

  scripts:
    name: Script syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check shell scripts
        run: bash -n scripts/*.sh

      - name: Check Python service syntax
        run: python3 -m py_compile ai-service/app/main.py ai-service/app/model_runtime.py scripts/benchmark_api.py

name: Update contributors

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contributors
  cancel-in-progress: true

jobs:
  update:
    name: Regenerate README contributor grids
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate contributor grids
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_contributors.py --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_SHA"

      - name: Commit updated READMEs
        run: |
          if git diff --quiet -- README.md README.zh-CN.md; then
            echo "Contributor grids are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md
          git commit -m "docs: update contributors [skip ci]"
          git push

server:
  port: 8080

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

spring:
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false

finsight:
  auth:
    secure-cookie: false
    email-enabled: false
    mail-from: ${FINSIGHT_AUTH_MAIL_FROM:noreply@finsight.local}
    public-base-url: ${FINSIGHT_PUBLIC_BASE_URL:http://localhost:8080}
  ai-service-url: http://localhost:8001
  ai-service:
    enabled: false
  cache:
    analysis-ttl: PT6H
  stock-universe:
    free-provider-enabled: true
  recommendations:
    result-limit: 24
    strategy:
      version: market-score-v1
      eligibility:
        minimum-price: 2
        minimum-amount: 80000000
        minimum-change-percent: -9.5
      weights:
        trend: 0.48
        liquidity: 0.24
        valuation: 0.28
      trend:
        base-score: 52
        change-multiplier: 7
        amplitude-threshold: 5
        amplitude-penalty-multiplier: 2.2
      valuation:
        base-score: 68
        preferred-pe-max: 45
        acceptable-pe-max: 80
        preferred-pe-bonus: 12
        acceptable-pe-bonus: 3
        pe-penalty: 12
        preferred-pb-max: 8
        preferred-pb-bonus: 8
        pb-penalty: 10
      risk:
        amplitude-threshold: 7
        amplitude-penalty-multiplier: 1.4
        absolute-change-threshold: 7
        change-penalty-multiplier: 2.2
  scheduler:
    enabled: false
    zone: Asia/Shanghai
    stock-universe-cron: "0 20 8 * * MON-FRI"
    batch-analysis-cron: "0 45 8 * * MON-FRI"
    daily-recommendation-cron: "0 10 15 * * MON-FRI"
    batch-limit: 20
  embedding:
    dimension: 384
  workflow:
    allow-local-lease-fallback: true
    exchange: finsight.workflow.exchange
    ingestion-queue: finsight.workflow.ingestion
    ingestion-routing-key: workflow.ingestion
    retry-queue: finsight.workflow.retry
    retry-routing-key: workflow.retry
    retry-delay-ms: 5000
    dead-letter-exchange: finsight.workflow.dlx
    dead-letter-queue: finsight.workflow.dead-letter
    running-timeout: PT10M
    recovery-delay-ms: 60000
